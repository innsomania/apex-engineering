name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        # pyproject excludes the vendored skills and the suites.
        run: mypy --ignore-missing-imports .

  mutations:
    name: gates are actually checked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mutation check
        # Breaks each gate in a throwaway copy and requires the live check to
        # notice. Guards against an assertion being loosened later.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          python Test/run_mutation_check.py --output mutations.json

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unittest
        # Tests needing an authenticated Codex CLI or a toolchain skip themselves.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s Test -p 'test_*.py' -v
      - name: live controls
        # Drives the hook through a real turn on a disposable project. The
        # suites check its branches; this checks that the gates actually fire.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          python Test/run_live_control_check.py --output "live-controls.json"
